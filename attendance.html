<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Science World — Mark Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F4FC;
    --surface:rgba(255,255,255,.68);
    --surface-solid:#FFFFFF;
    --border:#E1E5F5;
    --ink:#131A33;
    --ink-dim:#5C6584;
    --primary:#4F5FF0;
    --primary-2:#06B6D4;
    --coral:#FF6B6B;
    --good:#12B76A;
    --danger:#E23D3D;
    --warn:#F59E0B;
    --radius:20px;
    --grad-brand:linear-gradient(135deg,#4F5FF0 0%,#06B6D4 100%);
    --grad-warm:linear-gradient(135deg,#FF6B6B 0%,#F59E0B 100%);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 640px at 8% -8%, rgba(79,95,240,.20), transparent 55%),
      radial-gradient(900px 700px at 104% 6%, rgba(6,182,212,.20), transparent 55%),
      radial-gradient(700px 620px at 50% 112%, rgba(255,107,107,.14), transparent 55%),
      linear-gradient(180deg,#F6F7FD 0%, #F2F4FC 45%, #F7F3FB 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,.display{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  button,input{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

  .center-wrap{max-width:420px;margin:0 auto;padding:28px 20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;}
  .screen{display:none;}
  .screen.active{display:block;animation:screenIn .5s cubic-bezier(.22,1,.36,1);}
  @keyframes screenIn{ from{opacity:0;transform:translateY(10px) scale(.99);} to{opacity:1;transform:none;} }

  /* ---------- Brand header ---------- */
  .brand-row{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:22px;}
  .logo{width:44px;height:44px;border-radius:13px;object-fit:cover;flex:none;background:var(--surface-solid);border:1px solid var(--border);box-shadow:0 6px 16px -6px rgba(79,95,240,.35);}
  .brand-txt{text-align:left;}
  .brand-txt .name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;line-height:1.15;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);font-weight:600;}

  .hero-sub{text-align:center;color:var(--ink-dim);font-size:13.5px;margin:0 0 22px;}

  /* ---------- Card ---------- */
  .card{
    background:var(--surface);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.7);border-radius:var(--radius);padding:24px;
    box-shadow:0 10px 32px -14px rgba(19,26,51,.18);
    animation:cardIn .45s cubic-bezier(.22,1,.36,1);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px;font-weight:600;}
  .input{
    width:100%;background:rgba(255,255,255,.6);border:1.5px solid var(--border);border-radius:12px;
    padding:14px 15px;color:var(--ink);font-size:16px;transition:border-color .2s ease, box-shadow .2s ease;
  }
  .input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,95,240,.14);}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;
    background:var(--grad-brand);background-size:200% auto;
    color:#fff;border:none;border-radius:15px;
    padding:17px;font-weight:700;font-size:16px;width:100%;letter-spacing:.01em;
    box-shadow:0 10px 24px -8px rgba(79,95,240,.5);
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, opacity .2s ease, background-position .5s ease;
  }
  .btn:hover:not(:disabled){background-position:100% 50%;transform:translateY(-1px);}
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}

  .msg{font-size:13.5px;margin-top:12px;text-align:center;font-weight:600;line-height:1.5;}
  .msg.err{color:var(--danger);}
  .msg.ok{color:var(--good);}
  .msg.info{color:var(--ink-dim);font-weight:500;}

  .suggest-hint{color:var(--ink-dim);font-size:12.5px;margin-top:14px;text-align:center;}
  .suggest-btn{
    width:100%;text-align:left;background:rgba(255,255,255,.65);border:1px solid var(--border);border-radius:13px;
    padding:13px 15px;margin-top:8px;font-size:14.5px;font-weight:600;color:var(--ink);
    transition:border-color .2s ease, transform .15s ease;
  }
  .suggest-btn:hover{border-color:var(--primary);transform:translateX(2px);}
  .suggest-btn .d{font-weight:500;color:var(--ink-dim);font-size:12px;margin-top:2px;}

  /* ---------- Mark screen ---------- */
  .stu-block{text-align:center;margin-bottom:6px;}
  .stu-name{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;}
  .stu-meta{color:var(--ink-dim);font-size:13px;margin-top:2px;}

  .status-chip{
    display:inline-flex;align-items:center;gap:7px;margin:16px auto 4px;padding:6px 13px 6px 10px;
    background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:99px;
    font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;color:var(--ink-dim);
    letter-spacing:.02em;
  }
  .status-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-dim);flex:none;}
  .status-chip.live .dot{background:var(--good);box-shadow:0 0 0 0 rgba(18,183,106,.6);animation:dotPulse 1.8s ease-out infinite;}
  .status-chip.live{color:var(--good);border-color:rgba(18,183,106,.3);}
  .status-chip.closed .dot{background:var(--danger);}
  .status-chip.closed{color:var(--danger);border-color:rgba(226,61,61,.3);}
  @keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(18,183,106,.55);}70%{box-shadow:0 0 0 7px rgba(18,183,106,0);}100%{box-shadow:0 0 0 0 rgba(18,183,106,0);}}
  .chip-row{display:flex;justify-content:center;margin-bottom:6px;}

  /* ---------- Radar / signature element ---------- */
  .radar-wrap{position:relative;width:132px;height:132px;margin:14px auto 20px;display:flex;align-items:center;justify-content:center;}
  .radar-wrap .ring{
    position:absolute;border-radius:50%;border:2px solid var(--primary);opacity:0;
    animation:radarPulse 2.6s ease-out infinite;
  }
  .radar-wrap .ring:nth-child(2){animation-delay:.87s;}
  .radar-wrap .ring:nth-child(3){animation-delay:1.74s;}
  @keyframes radarPulse{
    0%{width:40px;height:40px;opacity:.5;}
    100%{width:132px;height:132px;opacity:0;}
  }
  .radar-wrap.checking .ring{animation-duration:1.1s;border-color:var(--primary-2);}
  .radar-wrap.success .ring{display:none;}
  .radar-wrap .pin{
    position:relative;z-index:2;width:60px;height:60px;border-radius:50%;
    background:var(--grad-brand);display:flex;align-items:center;justify-content:center;
    font-size:26px;box-shadow:0 10px 24px -8px rgba(79,95,240,.55);
    transition:background .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .radar-wrap.success .pin{background:linear-gradient(135deg,#12B76A,#0E9F6E);transform:scale(1.08);}
  .radar-wrap.closed .pin{background:linear-gradient(135deg,#A8AFC7,#8991B0);}

  .switch-link{display:block;text-align:center;margin-top:20px;color:var(--ink-dim);font-size:13px;text-decoration:none;}
  .switch-link:hover{color:var(--primary);}

  .footnote{text-align:center;color:var(--ink-dim);font-size:11.5px;margin-top:24px;letter-spacing:.02em;}
</style>
</head>
<body>

<!-- ============== NAME ENTRY (one-time) ============== -->
<section id="screen-entry" class="screen active">
  <div class="center-wrap">
    <div class="brand-row">
      <img class="logo" id="entryLogo" src="logo.png" alt="logo" onerror="this.style.display='none'">
      <div class="brand-txt">
        <div class="eyebrow">GPS Check-In</div>
        <div class="name" id="entryTitle">Science World</div>
      </div>
    </div>
    <p class="hero-sub">Enter your name once — we'll remember you after that.</p>
    <div class="card">
      <div class="field">
        <label>Full name</label>
        <input id="nameInput" class="input" placeholder="e.g. Rahul Kumar" autocomplete="off">
      </div>
      <button class="btn" id="btnCheckName">Continue</button>
      <div class="msg err" id="entryErr"></div>
      <div id="suggestList"></div>
    </div>
  </div>
</section>

<!-- ============== MARK ATTENDANCE (repeat visits) ============== -->
<section id="screen-mark" class="screen">
  <div class="center-wrap">
    <div class="brand-row">
      <img class="logo" id="markLogo" src="logo.png" alt="logo" onerror="this.style.display='none'">
      <div class="brand-txt">
        <div class="eyebrow">GPS Check-In</div>
        <div class="name" id="markTitle">Science World</div>
      </div>
    </div>
    <div class="card">
      <div class="stu-block">
        <div class="stu-name" id="markStuName">—</div>
        <div class="stu-meta" id="markStuMeta">—</div>
      </div>
      <div class="chip-row">
        <div class="status-chip" id="windowChip"><span class="dot"></span><span id="windowChipText">—</span></div>
      </div>
      <div class="radar-wrap" id="radar">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="pin" id="radarPin">📍</div>
      </div>
      <button class="btn" id="btnMark">Mark Attendance</button>
      <div id="markStatus"></div>
    </div>
    <div class="footnote">Your location is checked once, only to confirm you're on campus.</div>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAe6pP87YnnND5s0Uq-KeryhJVDTjfLY9w",
  authDomain: "attandance-af5e2.firebaseapp.com",
  projectId: "attandance-af5e2",
  storageBucket: "attandance-af5e2.firebasestorage.app",
  messagingSenderId: "817067828327",
  appId: "1:817067828327:web:1ce972885ccff464eae0c2",
  measurementId: "G-086B3JJKSY"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

let authReadyResolve;
const authReady = new Promise(res => authReadyResolve = res);
onAuthStateChanged(auth, user => { if(user) authReadyResolve(user); });
signInAnonymously(auth).catch(e => { console.error(e); authReadyResolve(null); });

const $ = sel => document.querySelector(sel);
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=> s.classList.toggle("active", s.id===id));
}
function pad(n){ return n<10 ? "0"+n : ""+n; }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function timeStrToMinutes(t){ const [h,m]=(t||"0:0").split(":").map(Number); return h*60+(m||0); }
function distanceMeters(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

let config = {};
let currentStudent = null;

async function loadConfig(){
  const snap = await getDoc(doc(db,"config","settings"));
  config = snap.exists() ? snap.data() : {};
  const name = config.instituteName || "Science World";
  const logo = config.logoUrl || "logo.png";
  document.title = name + " — Mark Attendance";
  ["entryTitle","markTitle"].forEach(id=> $("#"+id).textContent = name);
  ["entryLogo","markLogo"].forEach(id=> $("#"+id).src = logo);
}

/* ---------------- NAME ENTRY / LOOKUP ---------------- */
$("#btnCheckName").addEventListener("click", findStudent);
$("#nameInput").addEventListener("keydown", e=>{ if(e.key==="Enter") findStudent(); });

async function findStudent(){
  const name = $("#nameInput").value.trim();
  const errEl = $("#entryErr");
  const suggWrap = $("#suggestList");
  errEl.textContent = ""; suggWrap.innerHTML = "";
  if(!name){ errEl.textContent = "Please enter your name."; return; }
  const btn = $("#btnCheckName");
  btn.disabled = true; btn.textContent = "Checking...";
  try{
    const q = query(collection(db,"students"), where("nameLower","==",name.toLowerCase()));
    const snap = await getDocs(q);
    const matches = snap.docs.filter(d=>d.data().active!==false).map(d=>({ id:d.id, ...d.data() }));
    if(matches.length === 0){
      errEl.textContent = "This name isn't registered. Ask your admin to register you.";
      return;
    }
    if(matches.length === 1){
      selectStudent(matches[0]);
      return;
    }
    suggWrap.innerHTML = `<div class="suggest-hint">Found ${matches.length} students with this name — pick your class/batch:</div>`;
    matches.forEach(m=>{
      const b = document.createElement("button");
      b.className = "suggest-btn";
      b.innerHTML = `${escapeHtml(m.name)}<div class="d">${escapeHtml(m.class||"")} · ${escapeHtml(m.batch||"")}</div>`;
      b.addEventListener("click", ()=> selectStudent(m));
      suggWrap.appendChild(b);
    });
  } catch(e){
    console.error(e);
    errEl.textContent = "Something went wrong. Please try again.";
  } finally {
    btn.disabled = false; btn.textContent = "Continue";
  }
}
function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function selectStudent(s){
  currentStudent = s;
  localStorage.setItem("sw_student_id", s.id);
  openMarkScreen();
}

/* ---------------- MARK ATTENDANCE SCREEN ---------------- */
function openMarkScreen(){
  showScreen("screen-mark");
  $("#markStuName").textContent = currentStudent.name;
  $("#markStuMeta").textContent = `${currentStudent.class||""} · ${currentStudent.batch||""}`;
  refreshMarkUI();
}

function setRadarState(state){
  const radar = $("#radar");
  radar.classList.remove("checking","success","closed");
  const pin = $("#radarPin");
  if(state === "checking"){ radar.classList.add("checking"); pin.textContent = "📍"; }
  else if(state === "success"){ radar.classList.add("success"); pin.textContent = "✓"; }
  else if(state === "closed"){ radar.classList.add("closed"); pin.textContent = "🔒"; }
  else { pin.textContent = "📍"; }
}

function updateWindowChip(){
  const chip = $("#windowChip");
  const label = $("#windowChipText");
  const start = config.checkinStart || "07:00";
  const end = config.checkinEnd || "10:00";
  const startMin = timeStrToMinutes(start);
  const endMin = timeStrToMinutes(end);
  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  const open = nowMin >= startMin && nowMin < endMin;
  chip.classList.remove("live","closed");
  chip.classList.add(open ? "live" : "closed");
  label.textContent = (open ? "OPEN NOW · " : "CLOSED · ") + start + "–" + end;
  return open;
}

async function refreshMarkUI(){
  const btn = $("#btnMark");
  const statusEl = $("#markStatus");
  btn.disabled = false;
  btn.textContent = "Mark Attendance";
  statusEl.innerHTML = "";
  setRadarState("idle");

  const windowOpen = updateWindowChip();
  const dateStr = todayStr();

  try{
    const existing = await getDoc(doc(db,"attendance",dateStr+"_"+currentStudent.id));
    if(existing.exists() && existing.data().status === "present"){
      btn.disabled = true;
      btn.textContent = "✓ Present for Today";
      setRadarState("success");
      statusEl.innerHTML = `<div class="msg ok">Your attendance for today is already marked.</div>`;
      return;
    }
  } catch(e){ console.error(e); }

  if(!windowOpen){
    btn.disabled = true;
    setRadarState("closed");
    statusEl.innerHTML = `<div class="msg info">Check-in is only open from ${config.checkinStart||"07:00"} to ${config.checkinEnd||"10:00"}.</div>`;
    return;
  }
  statusEl.innerHTML = `<div class="msg info">Tap the button once you're at the institute.</div>`;
}

$("#btnMark").addEventListener("click", async ()=>{
  const btn = $("#btnMark");
  const statusEl = $("#markStatus");
  statusEl.innerHTML = "";
  const dateStr = todayStr();

  const windowOpen = updateWindowChip();
  if(!windowOpen){
    statusEl.innerHTML = `<div class="msg err">Check-in is only open from ${config.checkinStart||"07:00"} to ${config.checkinEnd||"10:00"}.</div>`;
    return;
  }

  try{
    const closedSnap = await getDoc(doc(db,"closures",dateStr));
    if(closedSnap.exists() && closedSnap.data().closed === true){
      setRadarState("closed");
      statusEl.innerHTML = `<div class="msg err">🔒 The institute is closed today. Attendance can't be marked.</div>`;
      return;
    }
  } catch(e){ console.error(e); }

  if(config.geoLat == null || config.geoLng == null){
    statusEl.innerHTML = `<div class="msg err">The institute location hasn't been set up yet. Contact your admin.</div>`;
    return;
  }
  if(!navigator.geolocation){
    statusEl.innerHTML = `<div class="msg err">Location isn't supported on this device.</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = "Checking your location...";
  setRadarState("checking");

  navigator.geolocation.getCurrentPosition(async pos=>{
    const dist = distanceMeters(config.geoLat, config.geoLng, pos.coords.latitude, pos.coords.longitude);
    const radius = config.geoRadius || 120;
    if(dist > radius){
      setRadarState("idle");
      statusEl.innerHTML = `<div class="msg err">You're ~${Math.round(dist)}m from the institute (limit: ${radius}m).</div>`;
      btn.disabled = false;
      btn.textContent = "Mark Attendance";
      return;
    }
    try{
      const docId = dateStr+"_"+currentStudent.id;
      await setDoc(doc(db,"attendance",docId), {
        studentId: currentStudent.id, date: dateStr, status:"present",
        markedAt: serverTimestamp(), method:"gps", distance: Math.round(dist)
      });
      setRadarState("success");
      statusEl.innerHTML = `<div class="msg ok">Attendance marked! Have a great day.</div>`;
      btn.textContent = "✓ Present for Today";
    } catch(e){
      console.error(e);
      setRadarState("idle");
      statusEl.innerHTML = `<div class="msg err">Something went wrong. Please try again.</div>`;
      btn.disabled = false;
      btn.textContent = "Mark Attendance";
    }
  }, err=>{
    setRadarState("idle");
    statusEl.innerHTML = `<div class="msg err">Location permission is required — please allow it and try again.</div>`;
    btn.disabled = false;
    btn.textContent = "Mark Attendance";
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
});

/* ---------------- INIT ---------------- */
(async function init(){
  await authReady;
  await loadConfig();
  const savedId = localStorage.getItem("sw_student_id");
  if(savedId){
    try{
      const snap = await getDoc(doc(db,"students",savedId));
      if(snap.exists() && snap.data().active !== false){
        currentStudent = { id: savedId, ...snap.data() };
        openMarkScreen();
        return;
      } else {
        localStorage.removeItem("sw_student_id");
      }
    } catch(e){ console.error(e); }
  }
  showScreen("screen-entry");
})();
</script>
</body>
</html>
